<!DOCTYPE html>
<html>
    <head>

        <title>QR Code Generator using HTML CSS and JavaScript</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
      <div class="container">
        <p>Enter your text or URL</p>
        <input tupr="text" placeholder="Text or URL">


        <div id="imgBox">
            <img src="" id="qrImage">
        </div>
        <button onclick=generateQR()> Generate QR Code</button>
      </div> 
      
      <script>

        let imgBox = document.getElementById("imgBox");
        let qrImage = document.getElementById("qtImage");
        let qrText = document.getElementById("qtText");
        
        function generateQR(){
            qrImage.src = `http://api.qrserver.com/v1/create-qr-code/?${qrText}&size=1000x100`;
            
        }
      </script>
    </body>
</html>
